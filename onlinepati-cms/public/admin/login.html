<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Online Pati CMS</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-icon"><i class="fas fa-newspaper"></i></div>
        <h1>Online Pati CMS</h1>
        <p>Login to Admin Dashboard</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div id="credentialsSection">
          <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Username</label>
            <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
          </div>
          <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
          
          <div style="text-align: center; margin-top: 15px;">
            <a href="#" onclick="showResetInfo()" style="color:var(--text-muted); font-size: 0.85rem;">Forgot Password?</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="resetModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h3>Reset Password</h3>
      <p style="font-size: 0.9rem; margin-bottom: 15px;">To reset your password, you must use the <strong>Security Key</strong> (Master Password) provided during initial setup.</p>
      <div class="form-group">
        <label>Security Key</label>
        <input type="password" id="resetKey" class="form-control" placeholder="Master Key">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="resetNewPass" class="form-control" placeholder="••••••••">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="hideResetModal()">Cancel</button>
        <button class="btn btn-primary" onclick="executeReset()">Reset Now</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Check if already logged in
    (async () => {
      const isAuth = await checkAuth();
      if (isAuth) window.location.href = 'index.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
      errEl.classList.remove('show');

      try {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const data = await login(username, password);
        
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      }
    });

    function showResetInfo() {
      document.getElementById('resetModal').style.display = 'flex';
    }

    function hideResetModal() {
      document.getElementById('resetModal').style.display = 'none';
    }

    async function executeReset() {
      const securityKey = document.getElementById('resetKey').value;
      const newPassword = document.getElementById('resetNewPass').value;
      const username = document.getElementById('username').value || 'admin';

      if (!securityKey || !newPassword) {
        alert('Please enter both key and new password');
        return;
      }

      try {
        const res = await apiPost('/auth/reset-password', { securityKey, username, newPassword });
        alert('Password reset successful! You can now login.');
        hideResetModal();
      } catch (err) {
        alert('Reset failed: ' + err.message);
      }
    }

    function showResetInfo() {
      document.getElementById('resetModal').style.display = 'flex';
    }

    function hideResetModal() {
      document.getElementById('resetModal').style.display = 'none';
    }

    async function executeReset() {
      const securityKey = document.getElementById('resetKey').value;
      const newPassword = document.getElementById('resetNewPass').value;
      const username = document.getElementById('username').value || 'admin';

      if (!securityKey || !newPassword) {
        alert('Please enter both key and new password');
        return;
      }

      try {
        const res = await apiPost('/auth/reset-password', { securityKey, username, newPassword });
        alert('Password reset successful! You can now login.');
        hideResetModal();
      } catch (err) {
        alert('Reset failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
